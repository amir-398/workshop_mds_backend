services:
  # #user service
  api:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    environment:
      - PORT=${PORT}
      - URL_MONGO=mongodb://db/workshop_mds
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ./src/:/home/amir/app/
    env_file:
      - .env
    links:
      - db
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: ./docker/mongo/Dockerfile
    ports:
      - "27017:27017"
    volumes:
      - ./src/db/:/data/db/
    environment:
      MONGO_INITDB_DATABASE: workshop_mds
    env_file:
      - .env

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_SERVER: db
      ME_CONFIG_MONGODB_PORT: ${DB_PORT}
    ports:
      - "8081:8081"
    depends_on:
      - db
